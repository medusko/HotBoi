name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Configure Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_BANNER_UNIT_ID: ${{ secrets.ADMOB_BANNER_UNIT_ID }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing Android signing secrets (ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          python3 - <<'PY'
          import base64, os, pathlib

          ws = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          ks_path = ws / "release.keystore"
          ks_path.write_bytes(base64.b64decode("".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())))

          def esc(val: str) -> str:
              return val.replace("\\", "\\\\")

          lines = [
              f"storeFile={esc(str(ks_path))}",
              f"storePassword={esc(os.environ['KEYSTORE_PASSWORD'])}",
              f"keyAlias={esc(os.environ['KEY_ALIAS'])}",
              f"keyPassword={esc(os.environ['KEY_PASSWORD'])}",
          ]
          admob_unit = os.environ.get("ADMOB_BANNER_UNIT_ID", "").strip()
          if admob_unit:
              lines.append(f"admobBannerUnitId={esc(admob_unit)}")
          lines.append("")
          (ws / "keystore.properties").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Run Unit Tests & Build Signed Release APK + Play Store AAB
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease

      - name: Clean Up Release Signing Material
        if: always()
        run: rm -f "${{ github.workspace }}/release.keystore" "${{ github.workspace }}/keystore.properties"

      - name: Stage Release Artifacts
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.0.2-RC3}"
          cp app/build/outputs/apk/release/app-release.apk "HotBoi-Android-${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "HotBoi-Android-${VERSION}.aab"

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            HotBoi-Android-*.apk
            HotBoi-Android-*.aab

  release:
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate Release Notes
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.2-RC3' }}"
          if [[ -f "CHANGELOG.md" ]] && grep -q "## \[$TAG\]" CHANGELOG.md; then
            awk "/## \[$TAG\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          else
            cat > release_notes.md << EOF
          ### HotBoi $TAG
          Standalone native Android telemetry monitor, Medusko Home Screen Thermal Widget, and thermal watchdog for SFP+ / SFP28 optical transceivers & network gateways.
          EOF
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: HotBoi ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.2-RC3' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.2-RC3' }}
          prerelease: true
          files: |
            HotBoi-Android-*.apk
            HotBoi-Android-*.aab
          body_path: release_notes.md
